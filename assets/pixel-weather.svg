<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="565" viewBox="0 0 1200 565" role="img" aria-labelledby="title"><title id="title">Weather ETL architecture and engineering focus</title><rect x="0" y="0" width="1200" height="565" fill="#F0EEE9"/><rect x="0" y="0" width="1200" height="8" fill="#A38ADB"/><text x="36" y="46" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#66517F">02 / SELECTED WORK</text><text x="36" y="139" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="800" fill="#111111">Weather ETL.</text><text x="36" y="174" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#111111">Live weather becomes a growing historical dataset.</text><rect x="36" y="207" width="46" height="38" fill="#A38ADB"/><text x="45" y="234" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#111111">01</text><text x="103" y="234" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#66517F">EXTRACT</text><text x="320" y="234" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#111111">Request readings for configured cities via Open-Meteo.</text><rect x="36" y="266" width="46" height="38" fill="#A38ADB"/><text x="45" y="293" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#111111">02</text><text x="103" y="293" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#66517F">TRANSFORM</text><text x="320" y="293" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#111111">Select fields; classify temperatures Hot / Cold / Normal.</text><rect x="36" y="325" width="46" height="38" fill="#A38ADB"/><text x="45" y="352" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#111111">03</text><text x="103" y="352" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#66517F">LOAD</text><text x="320" y="352" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#111111">Append each clean record to a JSON Lines history.</text><rect x="36" y="384" width="46" height="38" fill="#A38ADB"/><text x="45" y="411" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#111111">04</text><text x="103" y="411" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#66517F">ANALYZE</text><text x="320" y="411" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#111111">Read-only category counts and average temperature by city.</text><rect x="36" y="452" width="1128" height="40" fill="#E3E0E7"/><text x="51" y="480" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#111111">PYTHON / URLLIB / REST API / JSON LINES</text><text x="36" y="528" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#68646B">Standard-library Python. Separate pipeline stages. History preserved.</text><g transform="translate(1128 65) scale(0.46)"><path d="M0-44Q8-8 44 0Q8 8 0 44Q-8 8-44 0Q-8-8 0-44Z" fill="#A38ADB" transform="translate(4 -2)"/><path d="M0-44Q8-8 44 0Q8 8 0 44Q-8 8-44 0Q-8-8 0-44Z" fill="#111"/></g></svg>