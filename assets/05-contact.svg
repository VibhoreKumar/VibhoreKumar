<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title">
<title id="title">Open to entry-level data engineering opportunities and collaboration</title>
<defs><pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#26343C" opacity=".08"/></pattern><clipPath id="edge"><rect x="1" y="1" width="1198" height="308" rx="22"/></clipPath></defs>
<style>@keyframes orbit{to{transform:rotate(360deg)}} @keyframes slide{50%{transform:translateX(400px)}} @keyframes glow{50%{opacity:.3}} .orbit{animation:orbit 24s linear infinite;transform-origin:1020px 240px} .slide{animation:slide 9s ease-in-out infinite} .glow{animation:glow 3s ease-in-out infinite} @media(prefers-reduced-motion:reduce){.orbit,.slide,.glow{animation:none}}</style>
<g clip-path="url(#edge)"><rect x="0" y="0" width="1200" height="310" fill="#F5F3ED" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="310" fill="url(#paper)" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="250" fill="#526B7A" stroke="none" stroke-width="2"/><text x="40" y="43" fill="#F5F3ED" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400">04 / NEXT CHAPTER</text><text x="40" y="110" fill="#F5F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="48" font-weight="900">LET’S BUILD SOMETHING</text><text x="40" y="166" fill="#F5F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="48" font-weight="900">THAT MAKES DATA USEFUL.</text><text x="42" y="216" fill="#F5F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400">Open to entry-level data engineering opportunities and collaboration.</text><rect x="0" y="250" width="1200" height="60" fill="#26343C" stroke="none" stroke-width="2"/><text x="40" y="288" fill="#D8D6C7" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400">VIBHORE KUMAR</text><text x="652" y="288" fill="#F5F3ED" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400">LEARNING IN PUBLIC / ONE BUILD AT A TIME</text></g>
<rect x="1" y="1" width="1198" height="308" rx="22" fill="none" stroke="#26343C" stroke-width="2"/></svg>