<style>@keyframes orbit{to{transform:rotate(360deg)}} @keyframes slide{50%{transform:translateX(400px)}} @keyframes glow{50%{opacity:.3}} .orbit{animation:orbit 24s linear infinite;transform-origin:1020px 240px} .slide{animation:slide 9s ease-in-out infinite} .glow{animation:glow 3s ease-in-out infinite} @media(prefers-reduced-motion:reduce){.orbit,.slide,.glow{animation:none}}</style>
<g clip-path="url(#edge)"><rect x="0" y="0" width="1200" height="624" fill="#F5F0E6" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="624" fill="url(#paper)" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="90" fill="#171D1E" stroke="none" stroke-width="2"/><text x="42" y="57" fill="#F5F0E6" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="800">FOLLOW THE DATA.</text><text x="840" y="39" fill="#F0D779" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400">01 / FIELD NOTES</text><text x="840" y="65" fill="#D1C8B9" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="400">DIRECTION + TOOLKIT</text><rect x="36" y="122" width="714" height="224" fill="#E89451" stroke="#171D1E" stroke-width="2"/><text x="60" y="158" fill="#171D1E" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400">THE SHIFT</text><text x="60" y="210" fill="#171D1E" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="800">From building interfaces</text><text x="60" y="253" fill="#171D1E" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="800">to understanding data flow.</text><text x="60" y="295" fill="#171D1E" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">CSE student at GD Goenka University, class of 2027.</text><text x="60" y="325" fill="#171D1E" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">Learning by building, debugging and documenting.</text><rect x="774" y="122" width="390" height="224" fill="#126568" stroke="#171D1E" stroke-width="2"/><text x="800" y="161" fill="#F5F0E6" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400">CURRENT PRACTICE</text><text x="800" y="207" fill="#F5F0E6" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700">01  Python ETL pipelines</text><text x="800" y="252" fill="#F5F0E6" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700">02  API integration</text><text x="800" y="297" fill="#F5F0E6" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700">03  Workflow automation</text><text x="38" y="394" fill="#171D1E" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700">THE TOOL INDEX</text><rect x="36" y="419" width="264" height="173" fill="#171D1E" stroke="#171D1E" stroke-width="2"/><text x="54" y="451" fill="#F5F0E6" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="700">DATA</text><text x="54" y="489" fill="#F5F0E6" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">Python / JSON</text><text x="54" y="524" fill="#F5F0E6" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">SQLite / MySQL</text><text x="54" y="559" fill="#F5F0E6" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">ETL / Logging</text><rect x="324" y="419" width="264" height="173" fill="#F5F0E6" stroke="#171D1E" stroke-width="2"/><text x="342" y="451" fill="#171D1E" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="700">FRONTEND</text><text x="342" y="489" fill="#171D1E" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">React / JavaScript</text><text x="342" y="524" fill="#171D1E" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">HTML / CSS</text><text x="342" y="559" fill="#171D1E" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">Tailwind CSS</text><rect x="612" y="419" width="264" height="173" fill="#F0D779" stroke="#171D1E" stroke-width="2"/><text x="630" y="451" fill="#171D1E" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="700">BACKEND</text><text x="630" y="489" fill="#171D1E" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">Node.js / Express</text><text x="630" y="524" fill="#171D1E" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">Django / REST APIs</text><text x="630" y="559" fill="#171D1E" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">MongoDB</text><rect x="900" y="419" width="264" height="173" fill="#E89451" stroke="#171D1E" stroke-width="2"/><text x="918" y="451" fill="#171D1E" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="700">WORKFLOW</text><text x="918" y="489" fill="#171D1E" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">Git / GitHub</text><text x="918" y="524" fill="#171D1E" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">GitHub Actions</text><text x="918" y="559" fill="#171D1E" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">Postman / VS Code</text></g>
