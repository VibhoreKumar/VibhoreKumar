,sans-serif" font-size="20" font-weight="700">02  API integration</text><text x="800" y="297" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700">03  Workflow automation</text><text x="38" y="394" fill="#F1F5FF" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700">THE TOOL INDEX</text><rect x="36" y="419" width="264" height="173" fill="#111A30" stroke="#354665" stroke-width="2" /><text x="54" y="451" fill="#F1F5FF" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="700">DATA</text><text x="54" y="489" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">Python / JSON</text><text x="54" y="524" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">SQLite / MySQL</text><text x="54" y="559" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">ETL / Logging</text><rect x="324" y="419" width="264" height="173" fill="#0B1020" stroke="#354665" stroke-width="2" /><text x="342" y="451" fill="#F1F5FF" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="700">FRONTEND</text><text x="342" y="489" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">React / JavaScript</text><text x="342" y="524" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">HTML / CSS</text><text x="342" y="559" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">Tailwind CSS</text><rect x="612" y="419" width="264" height="173" fill="#18243F" stroke="#354665" stroke-width="2" /><text x="630" y="451" fill="#F1F5FF" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="700">BACKEND</text><text x="630" y="489" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">Node.js / Express</text><text x="630" y="524" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">Django / REST APIs</text><text x="630" y="559" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">MongoDB</text><rect x="900" y="419" width="264" height="173" fill="#102C3D" stroke="#354665" stroke-width="2" /><text x="918" y="451" fill="#F1F5FF" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="700">WORKFLOW</text><text x="918" y="489" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">Git / GitHub</text><text x="918" y="524" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">GitHub Actions</text><text x="918" y="559" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400">Postman / VS Code</text></g>
