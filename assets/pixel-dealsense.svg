" font-size="25" fill="#F0F0E8">From YouTube creator data to sponsorship insights.</text><rect x="36" y="207" width="46" height="38" fill="#F0F0E8"/><text x="45" y="234" font-family="monospace" font-size="22" fill="#171916">01</text><text x="103" y="234" font-family="monospace" font-size="22" fill="#B2FF70">INGEST</text><text x="320" y="234" font-family="monospace" font-size="21" fill="#F0F0E8">Fetch channel and recent-video metrics from YouTube.</text><rect x="36" y="266" width="46" height="38" fill="#F0F0E8"/><text x="45" y="293" font-family="monospace" font-size="22" fill="#171916">02</text><text x="103" y="293" font-family="monospace" font-size="22" fill="#B2FF70">TRANSFORM</text><text x="320" y="293" font-family="monospace" font-size="21" fill="#F0F0E8">Clean, assign tiers and flag unusual engagement.</text><rect x="36" y="325" width="46" height="38" fill="#F0F0E8"/><text x="45" y="352" font-family="monospace" font-size="22" fill="#171916">03</text><text x="103" y="352" font-family="monospace" font-size="22" fill="#B2FF70">STORE</text><text x="320" y="352" font-family="monospace" font-size="21" fill="#F0F0E8">Load processed records into Supabase PostgreSQL.</text><rect x="36" y="384" width="46" height="38" fill="#F0F0E8"/><text x="45" y="411" font-family="monospace" font-size="22" fill="#171916">04</text><text x="103" y="411" font-family="monospace" font-size="22" fill="#B2FF70">SERVE</text><text x="320" y="411" font-family="monospace" font-size="21" fill="#F0F0E8">Explore in Streamlit with Gemini-assisted questions.</text><rect x="36" y="452" width="1128" height="40" fill="#292C26"/><text x="51" y="480" font-family="monospace" font-size="21" fill="#F0F0E8">PYTHON / SQL / POSTGRESQL / SUPABASE / STREAMLIT / GEMINI</text><text x="36" y="528" font-family="monospace" font-size="18" fill="#B8BDB1">Real creator metrics. Campaign costs are a labelled synthetic layer.</text><text x="36" y="557" font-family="monospace" font-size="18" fill="#B8BDB1">Anomaly flags descri