<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title"><title id="title">DealSense architecture, technology and data transparency</title><rect x="0" y="0" width="1200" height="590" fill="#F0EEE9"/><rect x="0" y="0" width="1200" height="8" fill="#A38ADB"/><text x="36" y="46" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#66517F">01 / SELECTED WORK</text><text x="36" y="139" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="800" fill="#111111">DealSense.</text><text x="36" y="174" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#111111">From YouTube creator data to sponsorship insights.</text><rect x="36" y="207" width="46" height="38" fill="#A38ADB"/><text x="45" y="234" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#111111">01</text><text x="103" y="234" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#66517F">INGEST</text><text x="320" y="234" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#111111">Fetch channel and recent-video metrics from YouTube.</text><rect x="36" y="266" width="46" height="38" fill="#A38ADB"/><text x="45" y="293" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#111111">02</text><text x="103" y="293" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#66517F">TRANSFORM</text><text x="320" y="293" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#111111">Clean, assign tiers and flag unusual engagement.</text><rect x="36" y="325" width="46" height="38" fill="#A38ADB"/><text x="45" y="352" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#111111">03</text><text x="103" y="352" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#66517F">STORE</text><text x="320" y="352" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#111111">Load processed records into Supabase PostgreSQL.</text><rect x="36" y="384" width="46" height="38" fill="#A38ADB"/><text x="45" y="411" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#111111">04</text><text x="103" y="411" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#66517F">SERVE</text><text x="320" y="411" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#111111">Explore in Streamlit with Gemini-assisted questions.</text><rect x="36" y="452" width="1128" height="40" fill="#E3E0E7"/><text x="51" y="480" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#111111">PYTHON / SQL / POSTGRESQL / SUPABASE / STREAMLIT / GEMINI</text><text x="36" y="528" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#68646B">Real creator metrics. Campaign costs are a labelled synthetic layer.</text><text x="36" y="557" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#68646B">Anomaly flags describe unusual patterns, not proof of fraud.</text><g transform="translate(1128 65) scale(0.46)"><path d="M0-44Q8-8 44 0Q8 8 0 44Q-8 8-44 0Q-8-8 0-44Z" fill="#A38ADB" transform="translate(4 -2)"/><path d="M0-44Q8-8 44 0Q8 8 0 44Q-8 8-44 0Q-8-8 0-44Z" fill="#111"/></g></svg>