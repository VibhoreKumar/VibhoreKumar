e" font-size="22" fill="#E7F06D">STORE</text><text x="320" y="352" font-family="DejaVu Sans Mono,monospace" font-size="21" fill="#F5F3EB">Load processed records into Supabase PostgreSQL.</text><rect x="36" y="384" width="46" height="38" fill="#F244A4"/><text x="45" y="411" font-family="DejaVu Sans Mono,monospace" font-size="22" fill="#F5F3EB">04</text><text x="103" y="411" font-family="DejaVu Sans Mono,monospace" font-size="22" fill="#E7F06D">SERVE</text><text x="320" y="411" font-family="DejaVu Sans Mono,monospace" font-size="21" fill="#F5F3EB">Explore in Streamlit with Gemini-assisted questions.</text><rect x="36" y="452" width="1128" height="40" fill="#232323"/><text x="51" y="480" font-family="DejaVu Sans Mono,monospace" font-size="21" fill="#F5F3EB">PYTHON / SQL / POSTGRESQL / SUPABASE / STREAMLIT / GEMINI</text><text x="36" y="528" font-family="DejaVu Sans Mono,monospace" font-size="18" fill="#BBBBBB">Real creator metrics. Campaign costs are a labelled synthetic layer.</text><text x="36" y="557" font-family="DejaVu Sans Mono,monospace" font-size="18" fill="#BBBBBB">Anomaly flags describe unusual patterns, not proof of fraud.</text><path d="M1128 35v30m-15-15h30" stroke="#F244A4" stroke-width="8"/></svg>