<g clip-path="url(#edge)"><rect x="0" y="0" width="1200" height="762" fill="#0B1020" stroke="none" stroke-width="2" /><rect x="0" y="0" width="1200" height="762" fill="url(#paper)" stroke="none" stroke-width="2" /><rect x="0" y="0" width="1200" height="90" fill="#111A30" stroke="none" stroke-width="2" /><text x="42" y="57" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="800">BUILT. DEBUGGED. LEARNED.</text><text x="840" y="39" fill="#C4B5FD" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400">02 / SELECTED WORK</text><text x="840" y="65" fill="#A6B4CC" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="400">PROJECT INDEX</text><rect x="36" y="116" width="72" height="112" fill="#102C3D" stroke="#354665" stroke-width="2" /><text x="48" y="183" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="800">01</text><text x="132" y="148" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="800">WEATHER ETL</text><text x="132" y="180" fill="#67E8F9" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400">Python / JSON / GitHub Actions</text><text x="132" y="212" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">Extract weather data for 16 cities, classify readings,</text><text x="132" y="240" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">and write JSON Lines. Scheduled every six hours.</text><path d="M132 258L1164 258" stroke="#354665" stroke-width="2" /><rect x="36" y="273" width="72" height="112" fill="#251B48" stroke="#354665" stroke-width="2" /><text x="48" y="340" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="800">02</text><text x="132" y="305" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="800">AI RESUME BUILDER</text><text x="132" y="337" fill="#67E8F9" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400">MERN / AI assistance / JWT</text><text x="132" y="369" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">Team-built resume creation with editable templates,</text><text x="132" y="397" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">live preview, authentication and PDF export.</text><path d="M132 415L1164 415" stroke="#354665" stroke-width="2" /><rect x="36" y="430" width="72" height="112" fill="#18243F" stroke="#354665" stroke-width="2" /><text x="48" y="497" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="800">03</text><text x="132" y="462" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="800">LOAN ORIGINATION</text><text x="132" y="494" fill="#67E8F9" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400">React / Django / REST APIs</text><text x="132" y="526" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">Internship work on loan processing workflows,</text><text x="132" y="554" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">reusable interfaces and backend integration.</text><path d="M132 572L1164 572" stroke="#354665" stroke-width="2" /><rect x="36" y="587" width="72" height="112" fill="#102C3D" stroke="#354665" stroke-width="2" /><text x="48" y="654" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="800">04</text><text x="132" y="619" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="800">WEBARCLIGHT 24×7</text><text x="132" y="651" fill="#67E8F9" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400">PHP / JavaScript / HTML / CSS</text><text x="132" y="683" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">Contributed frontend components and responsive</text><text x="132" y="711" fill="#F1F5FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">interfaces as part of the development team.</text></g>
