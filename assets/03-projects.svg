<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="496" viewBox="0 0 1200 496" role="img" aria-labelledby="title"><title id="title">Featured projects: DealSense creator intelligence and Weather ETL.</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#34434D" stroke-width=".5"/></pattern></defs><style>.flow{stroke-dasharray:6 12;animation:flow 12s linear infinite}@keyframes flow{to{stroke-dashoffset:-180}}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style><rect x="0" y="0" width="1200" height="496" rx="20" fill="#101820" stroke="none"/><text x="36" y="42" font-family="monospace" font-size="13" font-weight="400" fill="#D9F279">02 / SELECTED SYSTEMS</text><text x="36" y="90" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#F2F0E9">Built to make data useful.</text><rect x="36" y="124" width="704" height="344" rx="14" fill="#F2F0E9" stroke="none"/><text x="60" y="158" font-family="monospace" font-size="12" font-weight="400" fill="#42515C">PROJECT 01 / CREATOR INTELLIGENCE</text><text x="60" y="215" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#101820">DealSense</text><text x="60" y="251" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#42515C">From creator metrics to sponsorship insights.</text><rect x="60" y="277" width="656" height="74" rx="8" fill="#E2E4DB" stroke="none"/><text x="78" y="307" font-family="monospace" font-size="16" font-weight="400" fill="#101820">YOUTUBE API  →  PYTHON  →  POSTGRES</text><text x="78" y="332" font-family="monospace" font-size="12" font-weight="400" fill="#42515C">STREAMLIT DASHBOARD + GEMINI-ASSISTED QUERIES</text><text x="60" y="386" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101820">Clean. Segment. Analyze. Explore.</text><text x="60" y="421" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#42515C">Real creator data · Clearly labelled modeled costs</text><text x="60" y="449" font-family="monospace" font-size="12" font-weight="400" fill="#42515C">PYTHON / SQL / SUPABASE / STREAMLIT</text><rect x="760" y="124" width="404" height="344" rx="14" fill="#20342F" stroke="#34434D"/><text x="784" y="158" font-family="monospace" font-size="12" font-weight="400" fill="#D9F279">PROJECT 02 / WEATHER DATA</text><text x="784" y="210" font-family="Arial, sans-serif" font-size="33" font-weight="800" fill="#F2F0E9">Weather ETL</text><text x="784" y="249" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5B3BC">Small pipeline. Clear purpose.</text><path class="flow" d="M786 280H1130" stroke="#D9F279" stroke-width="2"/><text x="784" y="318" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#F2F0E9">API → classify → JSON Lines</text><text x="784" y="354" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#A5B3BC">Append history. Analyze trends.</text><text x="784" y="390" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#A5B3BC">Python standard library.</text><text x="784" y="443" font-family="monospace" font-size="12" font-weight="400" fill="#D9F279">OPEN-METEO / PYTHON / JSON</text></svg>