<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title">
<title id="title">neon hero — Vibhore Kumar</title>
<defs>
<radialGradient id="purple"><stop stop-color="#460649"/><stop offset="1" stop-color="#0D1017"/></radialGradient>
<linearGradient id="pink" x2="1" y2="1"><stop stop-color="#FF57D2"/><stop offset="1" stop-color="#BC27D6"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<style>@keyframes pulse{50%{opacity:.35}} @keyframes orbit{to{stroke-dashoffset:-120}} .pulse{animation:pulse 5s ease-in-out infinite} .orbit{animation:orbit 14s linear infinite} @media(prefers-reduced-motion:reduce){.pulse,.orbit{animation:none}}</style>
<rect width="1000" height="390" rx="16" fill="url(#purple)"/><path d="M82 45H415Q439 45 439 69V202Q439 226 415 226H388L408 258L350 226H82Q58 226 58 202V69Q58 45 82 45Z" fill="#0D1017" stroke="#F032BC" stroke-width="5"/><text x="249" y="94" fill="#F5DFED" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="500" text-anchor="middle">Hey, I’m Vibhore.</text><text x="249" y="134" fill="#F5DFED" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="500" text-anchor="middle">I build things.</text><text x="249" y="174" fill="#F5DFED" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="500" text-anchor="middle">Then follow the data.</text><text x="62" y="313" fill="#E845BD" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">FULL-STACK → DATA ENGINEERING</text><text x="62" y="350" fill="#F5DFED" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Python • ETL • APIs • Automation</text><circle class="pulse" cx="755" cy="175" r="132" fill="none" stroke="#FF3CD5" stroke-width="9" filter="url(#glow)"/><circle cx="755" cy="175" r="132" fill="none" stroke="#FC43CE" stroke-width="3"/><circle class="orbit" cx="755" cy="175" r="119" fill="none" stroke="#A82C9A" stroke-width="1.5" stroke-dasharray="12 9"/><text x="755" y="207" fill="#F5DFED" font-family="DejaVu Sans,Arial,sans-serif" font-size="103" font-weight="800" text-anchor="middle">VK</text><text x="755" y="356" fill="#E845BD" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">BUILD. DEBUG. REPEAT.</text></svg>