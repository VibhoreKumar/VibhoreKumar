<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title">
<title id="title">neon work — Vibhore Kumar</title>
<defs>
<radialGradient id="purple"><stop stop-color="#F3CAED"/><stop offset="1" stop-color="#FFF4FD"/></radialGradient>
<linearGradient id="pink" x2="1" y2="1"><stop stop-color="#FF57D2"/><stop offset="1" stop-color="#BC27D6"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<style>@keyframes pulse{50%{opacity:.35}} @keyframes orbit{to{stroke-dashoffset:-120}} .pulse{animation:pulse 5s ease-in-out infinite} .orbit{animation:orbit 14s linear infinite} @media(prefers-reduced-motion:reduce){.pulse,.orbit{animation:none}}</style>
<rect width="1000" height="650" rx="12" fill="url(#purple)"/><path d="M500 0V650M0 325H1000" stroke="#A41C95" stroke-opacity=".35" stroke-width="2"/><text x="35" y="46" fill="#4A174E" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="500" text-anchor="start">Weather ETL</text><text x="35" y="81" fill="#4A174E" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">16 cities. One Python pipeline.</text><text x="35" y="108" fill="#4A174E" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Structured data, every six hours.</text><rect x="35" y="150" width="78" height="65" rx="12" fill="#BE118B" fill-opacity=".18" stroke="#F139C8"/><text x="74" y="194" fill="#F14FCB" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="800" text-anchor="middle">ETL</text><text x="130" y="193" fill="#4A174E" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start">01 / BUILD</text><text x="675" y="46" fill="#4A174E" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="500" text-anchor="start">ReZoom</text><text x="675" y="81" fill="#4A174E" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">AI-assisted resumes, live preview</text><text x="675" y="108" fill="#4A174E" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">and PDF export. Built with MERN.</text><rect x="675" y="150" width="78" height="65" rx="12" fill="#BE118B" fill-opacity=".18" stroke="#F139C8"/><text x="714" y="194" fill="#F14FCB" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="800" text-anchor="middle">AI</text><text x="770" y="193" fill="#4A174E" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start">02 / CREATE</text><text x="35" y="432" fill="#4A174E" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="500" text-anchor="start">My toolkit</text><text x="35" y="467" fill="#4A174E" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Python, React and Django.</text><text x="35" y="494" fill="#4A174E" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">APIs, databases and automation.</text><rect x="35" y="536" width="78" height="65" rx="12" fill="#BE118B" fill-opacity=".18" stroke="#F139C8"/><text x="74" y="580" fill="#F14FCB" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="800" text-anchor="middle">&lt;/&gt;</text><text x="130" y="579" fill="#4A174E" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start">03 / EXPLORE</text><text x="675" y="432" fill="#4A174E" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="500" text-anchor="start">Let’s connect</text><text x="675" y="467" fill="#4A174E" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Open to data engineering roles</text><text x="675" y="494" fill="#4A174E" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">and interesting collaborations.</text><rect x="675" y="536" width="78" height="65" rx="12" fill="#BE118B" fill-opacity=".18" stroke="#F139C8"/><text x="714" y="580" fill="#F14FCB" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="800" text-anchor="middle">@</text><text x="770" y="579" fill="#4A174E" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start">04 / CONNECT</text><circle class="pulse" cx="500" cy="325" r="157" fill="none" stroke="#F321C7" stroke-width="9" filter="url(#glow)"/><circle cx="500" cy="325" r="157" fill="#FFF4FD" stroke="#F43CCD" stroke-width="3"/><circle class="orbit" cx="500" cy="325" r="143" fill="none" stroke="#AF278F" stroke-width="2" stroke-dasharray="5 11"/><text x="500" y="352" fill="#4A174E" font-family="DejaVu Sans,Arial,sans-serif" font-size="100" font-weight="800" text-anchor="middle">VK</text><text x="500" y="395" fill="#E94CC8" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">VIBHORE KUMAR</text></svg>